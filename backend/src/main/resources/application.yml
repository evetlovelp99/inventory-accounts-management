spring:
  application:
    name: beewax-backend
  profiles:
    active: dev
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  upload:
    dir: uploads
    inspect-report-subdir: inspect-reports
  exchange-rate:
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-beewax-jwt-secret-key-minimum-256-bits!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080
